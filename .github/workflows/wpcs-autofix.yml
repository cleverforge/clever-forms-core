name: WPCS Autofix

on:
  push:
    branches:
      - release/0.9.4-rc-foundation

permissions:
  contents: write

jobs:
  phpcbf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.4-rc-foundation
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Apply safe PHPCBF fixes
        run: vendor/bin/phpcbf || true
      - name: Commit tracked formatting fixes only
        run: |
          if git diff --quiet; then
            echo "No PHPCBF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked PHPCBF changes."
            exit 0
          fi
          git commit -m "style: apply WordPress coding standards autofixes"
          git push origin HEAD:release/0.9.4-rc-foundation
